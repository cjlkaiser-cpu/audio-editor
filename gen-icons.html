<!DOCTYPE html>
<html>
<body>
<canvas id="c"></canvas>
<script>
function draw(size) {
  const c = document.getElementById('c');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  // Background
  const bg = ctx.createLinearGradient(0, 0, size, size);
  bg.addColorStop(0, '#1e293b');
  bg.addColorStop(1, '#0f172a');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();
  // Waveform bars
  const bars = [0.3, 0.6, 0.9, 0.7, 1.0, 0.65, 0.85, 0.45, 0.7, 0.55, 0.8, 0.4];
  const barW = size * 0.04;
  const gap = size * 0.025;
  const totalW = bars.length * (barW + gap) - gap;
  const startX = (size - totalW) / 2;
  const cx = size / 2;
  bars.forEach((h, i) => {
    const barH = h * size * 0.5;
    const x = startX + i * (barW + gap);
    const grad = ctx.createLinearGradient(0, cx - barH, 0, cx + barH);
    grad.addColorStop(0, '#818cf8');
    grad.addColorStop(1, '#6366f1');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(x, cx - barH / 2, barW, barH, barW / 2);
    ctx.fill();
  });
  return c.toDataURL('image/png');
}

// Generate and download both sizes
[192, 512].forEach(size => {
  const url = draw(size);
  const a = document.createElement('a');
  a.href = url;
  a.download = `icon-${size}.png`;
  a.textContent = `Download icon-${size}.png`;
  a.style.display = 'block';
  document.body.appendChild(a);
  a.click();
});
</script>
</body>
</html>
